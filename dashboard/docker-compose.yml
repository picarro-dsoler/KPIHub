# Build context = repo root (needs KPIHub/Python + packages/locallib).
# DB: kpihub-postgis on shared Docker network kpihub-net (see PostGIS/DBInit/Dockerrun).
services:
  kpihub-weekly-dash:
    build:
      context: ../..
      dockerfile: KPIHub/dashboard/Dockerfile
    container_name: kpihub-weekly-dash
    ports:
      - "8052:8052"
    env_file:
      - ../../.env
    environment:
      PGHOST: kpihub-postgis
      PGPORT: "5432"
      KPIHUB_HOST: kpihub-postgis
      KPIHUB_DASH_PORT: "8052"
    networks:
      - kpihub-net
    restart: unless-stopped

networks:
  kpihub-net:
    external: true
